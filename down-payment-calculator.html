<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首付计算器 - Smart Finance Tools</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container" style="max-width:700px; margin:40px auto; padding:20px;">
    <h1>🏠 首付计算器</h1>
    <p>根据房产总价和首付比例计算首付金额及贷款额。</p>
    <div class="card" style="padding:25px; background:#f9fafc; border-radius:16px;">
        <div class="input-group" style="margin-bottom:15px;">
            <label>房产总价 (¥)</label>
            <input type="number" id="price" value="2000000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div class="input-group" style="margin-bottom:20px;">
            <label>首付比例 (%)</label>
            <input type="number" id="pct" value="30" step="1" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <button onclick="calcDownPayment()" class="btn" style="background:#2563eb; color:#fff; padding:12px 24px; border:none; border-radius:8px; cursor:pointer; font-size:16px;">计算</button>
        <div id="result" style="margin-top:20px; font-size:16px; background:#eef2ff; padding:15px; border-radius:8px;"></div>
    </div>
</div>
<script>
    function calcDownPayment() {
        const price = parseFloat(document.getElementById('price').value);
        const pct = parseFloat(document.getElementById('pct').value) / 100;
        if (isNaN(price) || isNaN(pct)) return alert('请输入有效数字');
        const down = price * pct;
        const loan = price - down;
        document.getElementById('result').innerHTML = `
            <strong>首付金额</strong>：¥${down.toFixed(2)}<br>
            <strong>贷款金额</strong>：¥${loan.toFixed(2)}
        `;
    }
</script>
<script src="feedback.js"></script>
<script src="recommendations.js"></script>
</body>
</html>
