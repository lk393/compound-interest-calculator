<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>租房vs买房 - Smart Finance Tools</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container" style="max-width: 700px; margin: 40px auto; padding: 20px;">
        <h1>🏠 租房 vs 买房</h1>
        <p>比较租房和买房在相同时间内的净财富差异。</p>
        <div class="card" style="padding: 25px; background: #f9fafc; border-radius: 16px;">
            <div class="input-group" style="margin-bottom: 15px;">
                <label>房产总价 (¥)</label>
                <input type="number" id="homePrice" value="3000000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>首付比例 (%)</label>
                <input type="number" id="downPaymentPct" value="30" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>房贷年利率 (%)</label>
                <input type="number" id="mortgageRate" value="4.5" step="0.1" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>月租金 (¥)</label>
                <input type="number" id="monthlyRent" value="5000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>房产年增值率 (%)</label>
                <input type="number" id="appreciation" value="5" step="0.1" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <div class="input-group" style="margin-bottom: 20px;">
                <label>持有年限</label>
                <input type="number" id="years" value="10" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <button onclick="compareRentBuy()" class="btn" style="background:#2563eb; color:#fff; padding:12px 24px; border:none; border-radius:8px; cursor:pointer; font-size:16px;">比较</button>
            <div id="result" style="margin-top: 20px; font-size: 16px; background: #eef2ff; padding: 15px; border-radius: 8px;"></div>
        </div>
    </div>
    <script>
        function compareRentBuy() {
            const price = parseFloat(document.getElementById('homePrice').value);
            const downPct = parseFloat(document.getElementById('downPaymentPct').value) / 100;
            const mr = parseFloat(document.getElementById('mortgageRate').value) / 100 / 12;
            const rent = parseFloat(document.getElementById('monthlyRent').value);
            const app = parseFloat(document.getElementById('appreciation').value) / 100;
            const years = parseInt(document.getElementById('years').value);
            if (isNaN(price) || isNaN(downPct) || isNaN(mr) || isNaN(rent) || isNaN(app) || isNaN(years)) return alert('请输入有效数字');

            const down = price * downPct;
            const loan = price - down;
            const months = years * 12;
            // 买房：月供
            const monthlyPayment = loan * mr * Math.pow(1 + mr, months) / (Math.pow(1 + mr, months) - 1);
            // 房产终值
            const futureHome = price * Math.pow(1 + app, years);
            // 买房净财富（忽略维护费、税费）
            const buyNetWorth = futureHome - (monthlyPayment * months) - down;

            // 租房：租金每年增长3%
            let rentPaid = 0;
            let rentGrowth = 0.03;
            let currentRent = rent;
            for (let i = 0; i < years; i++) {
                rentPaid += currentRent * 12;
                currentRent = currentRent * (1 + rentGrowth);
            }
            // 首付如果不买房，投资回报率 6%
            const investmentReturn = down * Math.pow(1 + 0.06, years);
            const rentNetWorth = investmentReturn - rentPaid;

            document.getElementById('result').innerHTML = `
                <strong>🏡 买房净财富</strong>：¥${buyNetWorth.toFixed(2)}<br>
                <strong>🏢 租房净财富</strong>：¥${rentNetWorth.toFixed(2)}<br>
                <strong>📊 差异（买房 - 租房）</strong>：¥${(buyNetWorth - rentNetWorth).toFixed(2)}
            `;
        }
    </script>
    <script src="feedback.js"></script>
    <script src="recommendations.js"></script>
</body>
</html>
