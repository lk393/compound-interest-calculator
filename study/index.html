<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习成长系统 — 让孩子爱上学习</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="study-style.css" />
    <style>
        .task-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--gray-100);
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-item .task-check {
            width: 20px;
            height: 20px;
            border: 2px solid var(--gray-300);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            background: white;
        }
        .task-item .task-check.done {
            background: var(--success);
            border-color: var(--success);
            color: white;
            font-size: 12px;
        }
        .task-item .task-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--gray-700);
        }
        .task-item .task-text.done {
            text-decoration: line-through;
            color: var(--gray-400);
        }
        .task-item .task-delete {
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.2rem 0.4rem;
        }
        .task-item .task-delete:hover {
            color: var(--danger);
        }
        .add-task-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .add-task-row input {
            flex: 1;
            padding: 0.5rem 0.7rem;
            border: 1.5px solid var(--gray-300);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .add-task-row input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .add-task-row button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .add-task-row button:hover {
            background: #1d4ed8;
        }

        .task-empty {
            color: var(--gray-400);
            font-size: 0.85rem;
            padding: 0.3rem 0;
        }

        .task-progress {
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-top: 0.3rem;
        }

        /* ===== 孩子管理（修复版） ===== */
        .child-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0.5rem 0.8rem;
            background: var(--gray-50);
            border-radius: 10px;
            border: 1px solid var(--gray-200);
        }
        .child-selector .label {
            font-size: 0.85rem;
            color: var(--gray-500);
            font-weight: 500;
        }
        .child-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            border: 1.5px solid var(--gray-300);
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--gray-600);
            transition: all 0.2s;
        }
        .child-tag:hover {
            border-color: var(--primary);
        }
        .child-tag.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        .child-tag .remove-btn {
            font-size: 0.7rem;
            opacity: 0.5;
            cursor: pointer;
            margin-left: 0.1rem;
            background: none;
            border: none;
            color: var(--gray-500);
            padding: 0 2px;
        }
        .child-tag .remove-btn:hover {
            opacity: 1;
            color: var(--danger);
        }
        .child-add-input {
            padding: 0.25rem 0.6rem;
            border: 1.5px solid var(--gray-300);
            border-radius: 20px;
            font-size: 0.8rem;
            background: white;
            width: 100px;
            transition: border-color 0.2s;
        }
        .child-add-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .child-add-btn {
            padding: 0.25rem 0.7rem;
            border: 1.5px solid var(--primary);
            border-radius: 20px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .child-add-btn:hover {
            background: #1d4ed8;
        }
        .child-selector .hint {
            font-size: 0.7rem;
            color: var(--gray-400);
            margin-left: auto;
        }
        @media (max-width: 640px) {
            .child-selector {
                flex-direction: column;
                align-items: stretch;
                gap: 0.4rem;
            }
            .child-selector .label {
                margin-bottom: 0.1rem;
            }
            .child-add-input {
                width: 100%;
            }
            .child-selector .hint {
                margin-left: 0;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== 顶部导航 ===== -->
    <div class="top-nav">
        <a href="../index.html" class="back-link">← 返回首页</a>
        <div class="breadcrumb">📚 <span>学习成长系统</span></div>
    </div>

    <!-- ===== 孩子选择器（修复版） ===== -->
    <div class="card" style="padding:0.6rem 1rem;">
        <div class="child-selector" id="childSelector">
            <span class="label">👤 孩子:</span>
            <div id="childTags" style="display:flex; flex-wrap:wrap; gap:0.4rem; align-items:center;"></div>
            <input type="text" class="child-add-input" id="childNameInput" placeholder="输入名字" maxlength="10" />
            <button class="child-add-btn" onclick="addChild()">➕ 添加</button>
            <span class="hint" id="childHint">点击名字切换，× 删除</span>
        </div>
    </div>

    <!-- ===== 欢迎区域 ===== -->
    <div class="card" style="background: var(--primary-light); border-left: 4px solid var(--primary);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap;">
            <div>
                <h2 id="greeting">👋 欢迎回来，小勇士！</h2>
                <p id="subGreeting" style="margin:0.2rem 0 0;">今天也要加油哦！每完成一项任务，你离「自律小英雄」就更近一步 🦸</p>
            </div>
        </div>
    </div>

    <!-- ===== 统计卡片 ===== -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-item highlight">
            <div class="number" id="streakDays">0</div>
            <div class="label">🔥 连续打卡</div>
        </div>
        <div class="stat-item">
            <div class="number" id="totalTasks">0</div>
            <div class="label">📝 完成任务</div>
        </div>
        <div class="stat-item">
            <div class="number" id="avgAccuracy">0%</div>
            <div class="label">🎯 平均正确率</div>
        </div>
        <div class="stat-item">
            <div class="number" id="level">Lv.1</div>
            <div class="label">⭐ 等级</div>
        </div>
    </div>

    <!-- ===== 近期正确率趋势 ===== -->
    <div class="card">
        <h2>📈 最近7天正确率</h2>
        <div class="progress-chart" id="chartContainer"></div>
    </div>

    <!-- ===== 今日任务 ===== -->
    <div class="card">
        <h2>📋 今日任务 <span id="taskProgress" class="task-progress"></span></h2>
        <div id="taskListContainer">
            <div id="taskList" class="task-list"></div>
        </div>
        <div class="add-task-row">
            <input type="text" id="newTaskInput" placeholder="输入新任务，如：数学练习册 P10-15" />
            <button onclick="addTask()">添加</button>
        </div>
        <div class="action-row" style="margin-top:0.8rem;">
            <a href="upload.html" class="btn">📸 拍照上传作业</a>
            <a href="progress.html" class="btn btn-secondary">📊 成长曲线</a>
        </div>
    </div>

    <!-- ===== 最近成就 ===== -->
    <div class="card">
        <h2>🏅 最近获得的徽章</h2>
        <ul class="task-list" id="recentBadges">
            <li style="color:var(--gray-400); padding:0.3rem 0;">继续学习，解锁更多徽章 🏆</li>
        </ul>
    </div>

    <!-- ===== 数据管理 ===== -->
    <div class="card">
        <h2>💾 数据管理</h2>
        <p style="font-size:0.85rem;color:var(--gray-500);">定期备份数据，防止意外丢失</p>
        <div class="action-row" style="margin-top:0.5rem;">
            <button class="btn btn-secondary" onclick="exportData()">📥 导出备份</button>
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📤 导入备份</button>
            <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)" />
        </div>
        <p style="font-size:0.75rem;color:var(--gray-400);margin-top:0.5rem;">
            💡 建议每次学习数据较多时导出备份，更换设备时可导入恢复
        </p>
    </div>

    <!-- ===== 页脚 ===== -->
    <footer style="text-align:center; color:var(--gray-400); font-size:0.75rem; padding:0.5rem 0; border-top:1px solid var(--gray-200); margin-top:0.5rem;">
        <p>© 2026 — 学习成长系统 · 用坚持看见进步</p>
    </footer>
</div>

<script>
    // ============================================================
    //  多孩子数据管理
    // ============================================================

    function getChildren() {
        return JSON.parse(localStorage.getItem('studyChildren') || '[]');
    }

    function saveChildren(children) {
        localStorage.setItem('studyChildren', JSON.stringify(children));
    }

    function getCurrentChildId() {
        return localStorage.getItem('studyCurrentChild') || null;
    }

    function setCurrentChildId(id) {
        localStorage.setItem('studyCurrentChild', id);
    }

    function getCurrentChild() {
        const children = getChildren();
        const id = getCurrentChildId();
        if (!id) return null;
        return children.find(c => c.id === id) || null;
    }

    function getChildData(childId) {
        const key = 'studyData_' + childId;
        const raw = localStorage.getItem(key);
        if (raw) {
            try { return JSON.parse(raw); } catch(e) {}
        }
        return { records: [], streak: { days: 0, lastDate: null }, tasks: [] };
    }

    function saveChildData(childId, data) {
        localStorage.setItem('studyData_' + childId, JSON.stringify(data));
    }

    // ============================================================
    //  孩子管理操作
    // ============================================================

    function addChild() {
        const input = document.getElementById('childNameInput');
        const name = input.value.trim();
        if (!name) {
            alert('请输入孩子的名字！');
            return;
        }
        const children = getChildren();
        // 检查是否已存在同名（可选）
        if (children.some(c => c.name === name)) {
            alert('已存在同名孩子，请换个名字');
            return;
        }
        const id = Date.now().toString(36);
        children.push({ id, name, createdAt: new Date().toISOString() });
        saveChildren(children);
        setCurrentChildId(id);
        saveChildData(id, { records: [], streak: { days: 0, lastDate: null }, tasks: [] });
        input.value = '';
        renderChildSelector();
        refreshAll();
    }

    function removeChild(id) {
        if (!confirm('确定要删除这个孩子的所有学习数据吗？此操作不可恢复！')) return;
        let children = getChildren();
        children = children.filter(c => c.id !== id);
        saveChildren(children);
        localStorage.removeItem('studyData_' + id);
        if (getCurrentChildId() === id) {
            if (children.length > 0) {
                setCurrentChildId(children[0].id);
            } else {
                setCurrentChildId(null);
            }
        }
        renderChildSelector();
        refreshAll();
    }

    function switchChild(id) {
        if (id === getCurrentChildId()) return;
        setCurrentChildId(id);
        renderChildSelector();
        refreshAll();
    }

    // ============================================================
    //  当前孩子数据读写
    // ============================================================

    function getCurrentData() {
        const child = getCurrentChild();
        if (!child) return { records: [], streak: { days: 0, lastDate: null }, tasks: [] };
        return getChildData(child.id);
    }

    function saveCurrentData(data) {
        const child = getCurrentChild();
        if (!child) return;
        saveChildData(child.id, data);
    }

    function getRecords() {
        return getCurrentData().records || [];
    }

    function saveRecords(records) {
        const data = getCurrentData();
        data.records = records;
        saveCurrentData(data);
    }

    function getStreak() {
        return getCurrentData().streak || { days: 0, lastDate: null };
    }

    function saveStreak(streak) {
        const data = getCurrentData();
        data.streak = streak;
        saveCurrentData(data);
    }

    function getTasks() {
        return getCurrentData().tasks || [];
    }

    function saveTasks(tasks) {
        const data = getCurrentData();
        data.tasks = tasks;
        saveCurrentData(data);
    }

    function getChildName() {
        const child = getCurrentChild();
        return child ? child.name : '小勇士';
    }

    // ============================================================
    //  渲染孩子选择器
    // ============================================================

    function renderChildSelector() {
        const container = document.getElementById('childTags');
        const children = getChildren();
        const currentId = getCurrentChildId();

        container.innerHTML = '';

        if (children.length === 0) {
            container.innerHTML = '<span style="color:var(--gray-400);font-size:0.85rem;">请添加孩子</span>';
            return;
        }

        children.forEach(child => {
            const tag = document.createElement('span');
            tag.className = 'child-tag' + (child.id === currentId ? ' active' : '');
            tag.innerHTML = `${child.name} ${child.id === currentId ? '✓' : ''}`;
            tag.onclick = () => switchChild(child.id);

            // 删除按钮
            const delBtn = document.createElement('button');
            delBtn.className = 'remove-btn';
            delBtn.textContent = '✕';
            delBtn.onclick = function(e) {
                e.stopPropagation();
                removeChild(child.id);
            };
            tag.appendChild(delBtn);

            container.appendChild(tag);
        });
    }

    // ============================================================
    //  今日任务管理
    // ============================================================

    function renderTasks() {
        const tasks = getTasks();
        const list = document.getElementById('taskList');
        const progress = document.getElementById('taskProgress');

        const today = new Date().toISOString().slice(0, 10);
        const todayTasks = tasks.filter(t => t.date === today);

        if (todayTasks.length === 0) {
            list.innerHTML = '<li class="task-empty">今天还没有任务，添加一个吧 📝</li>';
            progress.textContent = '';
            return;
        }

        const total = todayTasks.length;
        const done = todayTasks.filter(t => t.done).length;
        progress.textContent = `(${done}/${total} 已完成)`;

        list.innerHTML = todayTasks.map((task, index) => `
            <li class="task-item">
                <div class="task-check ${task.done ? 'done' : ''}" onclick="toggleTask(${index})">
                    ${task.done ? '✓' : ''}
                </div>
                <span class="task-text ${task.done ? 'done' : ''}">${task.text}</span>
                <button class="task-delete" onclick="deleteTask(${index})">✕</button>
            </li>
        `).join('');
    }

    function addTask() {
        const input = document.getElementById('newTaskInput');
        const text = input.value.trim();
        if (!text) {
            alert('请输入任务内容！');
            return;
        }

        const tasks = getTasks();
        const today = new Date().toISOString().slice(0, 10);
        tasks.push({ date: today, text: text, done: false });
        saveTasks(tasks);
        input.value = '';
        renderTasks();
        updateStats();
    }

    function toggleTask(index) {
        const tasks = getTasks();
        const today = new Date().toISOString().slice(0, 10);
        let realIndex = -1;
        let count = 0;
        for (let i = 0; i < tasks.length; i++) {
            if (tasks[i].date === today) {
                if (count === index) { realIndex = i; break; }
                count++;
            }
        }
        if (realIndex !== -1) {
            tasks[realIndex].done = !tasks[realIndex].done;
            saveTasks(tasks);
            renderTasks();
            updateStats();
            const todayTasksNow = tasks.filter(t => t.date === today);
            if (todayTasksNow.every(t => t.done)) {
                updateStreak(today);
            }
        }
    }

    function deleteTask(index) {
        const tasks = getTasks();
        const today = new Date().toISOString().slice(0, 10);
        let realIndex = -1;
        let count = 0;
        for (let i = 0; i < tasks.length; i++) {
            if (tasks[i].date === today) {
                if (count === index) { realIndex = i; break; }
                count++;
            }
        }
        if (realIndex !== -1) {
            tasks.splice(realIndex, 1);
            saveTasks(tasks);
            renderTasks();
            updateStats();
        }
    }

    // ============================================================
    //  打卡更新
    // ============================================================

    function updateStreak(today) {
        const streak = getStreak();
        const lastDate = streak.lastDate;
        if (lastDate === today) return;
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().slice(0, 10);
        if (lastDate === yesterdayStr) {
            streak.days += 1;
        } else {
            streak.days = 1;
        }
        streak.lastDate = today;
        saveStreak(streak);
    }

    // ============================================================
    //  统计与渲染
    // ============================================================

    function updateStats() {
        const records = getRecords();
        const streak = getStreak();
        const tasks = getTasks();
        const today = new Date().toISOString().slice(0, 10);
        const todayTasks = tasks.filter(t => t.date === today);

        const days = new Set(records.map(r => r.date));
        const totalDays = days.size;
        const totalTasks = records.length;
        const avg = records.length > 0
            ? Math.round(records.reduce((s, r) => s + r.accuracy, 0) / records.length)
            : 0;
        const bestStreak = streak.days || 0;

        let level = 1;
        if (totalTasks >= 5) level = 2;
        if (totalTasks >= 15) level = 3;
        if (totalTasks >= 30) level = 4;
        if (totalTasks >= 50) level = 5;
        if (totalTasks >= 80) level = 6;

        document.getElementById('streakDays').textContent = bestStreak;
        document.getElementById('totalTasks').textContent = totalTasks;
        document.getElementById('avgAccuracy').textContent = avg + '%';
        document.getElementById('level').textContent = 'Lv.' + level;

        renderChart(records);
        renderBadges(records, streak);
    }

    function renderChart(records) {
        const container = document.getElementById('chartContainer');
        container.innerHTML = '';

        let data = [60, 70, 75, 80, 85, 90, 88];

        if (records.length > 0) {
            const dailyMap = {};
            records.forEach(r => {
                if (!dailyMap[r.date]) dailyMap[r.date] = { total: 0, count: 0 };
                dailyMap[r.date].total += r.accuracy;
                dailyMap[r.date].count += 1;
            });
            const sorted = Object.keys(dailyMap).sort();
            const recent = sorted.slice(-7);
            if (recent.length > 0) {
                data = recent.map(date => Math.round(dailyMap[date].total / dailyMap[date].count));
            }
        }

        const max = Math.max(...data, 10);
        data.forEach(val => {
            const height = (val / max) * 100;
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = height + '%';
            bar.innerHTML = `<span class="bar-label">${val}%</span>`;
            container.appendChild(bar);
        });
    }

    function renderBadges(records, streak) {
        const list = document.getElementById('recentBadges');
        const badges = [];

        if (records.length > 0) badges.push({ icon: '🥇', name: '首战告捷' });
        if (streak.days >= 7) badges.push({ icon: '🔥', name: '七天坚持' });
        if (streak.days >= 14) badges.push({ icon: '⚡', name: '两周先锋' });
        if (streak.days >= 30) badges.push({ icon: '👑', name: '三十天王者' });
        if (records.filter(r => r.accuracy === 100).length > 0) badges.push({ icon: '💯', name: '满分达人' });

        const seen = new Set();
        const unique = badges.filter(b => {
            if (seen.has(b.name)) return false;
            seen.add(b.name);
            return true;
        });

        if (unique.length === 0) {
            list.innerHTML = '<li style="color:var(--gray-400);padding:0.3rem 0;">继续学习，解锁更多徽章 🏆</li>';
            return;
        }

        list.innerHTML = unique.slice(0, 5).map(b =>
            `<li><span class="icon">${b.icon}</span> ${b.name}</li>`
        ).join('');
    }

    // ============================================================
    //  刷新全部
    // ============================================================

    function refreshAll() {
        const name = getChildName();
        document.getElementById('greeting').textContent = `👋 欢迎回来，${name}！`;
        document.getElementById('subGreeting').textContent = `今天也要加油哦！每完成一项任务，你离「自律小英雄」就更近一步 🦸`;
        renderTasks();
        updateStats();
    }

    // ============================================================
    //  数据备份与恢复（兼容多孩子）
    // ============================================================

    function exportData() {
        const children = getChildren();
        const allData = {};
        children.forEach(child => {
            allData[child.id] = getChildData(child.id);
        });

        const data = {
            version: '2.0',
            exportedAt: new Date().toISOString(),
            children: children,
            currentChildId: getCurrentChildId(),
            data: allData
        };

        const name = children.length > 0 ? children[0].name : '学习系统';
        const date = new Date().toISOString().slice(0, 10);
        const filename = `${name}_学习数据_${date}.json`;

        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        alert('✅ 数据已导出！\n\n文件名: ' + filename + '\n包含 ' + children.length + ' 个孩子的数据');
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);

                if (!data.version || !data.children || !data.data) {
                    alert('❌ 无效的备份文件，请检查文件格式。');
                    return;
                }

                const confirmMsg = `⚠️ 恢复数据将覆盖当前所有数据！

📊 备份信息：
👶 孩子数: ${data.children.length} 个
📅 导出时间: ${data.exportedAt || '未知'}
当前孩子: ${data.children.map(c => c.name).join('、')}

确定要恢复吗？`;

                if (!confirm(confirmMsg)) return;

                saveChildren(data.children);
                data.children.forEach(child => {
                    if (data.data[child.id]) {
                        saveChildData(child.id, data.data[child.id]);
                    }
                });
                if (data.currentChildId) {
                    setCurrentChildId(data.currentChildId);
                } else if (data.children.length > 0) {
                    setCurrentChildId(data.children[0].id);
                }

                alert('✅ 数据恢复成功！页面即将刷新。');
                location.reload();

            } catch (err) {
                alert('❌ 解析备份文件失败，请确认文件格式正确。\n\n错误信息: ' + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ============================================================
    //  初始化
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
        const children = getChildren();
        if (children.length === 0) {
            // 创建默认孩子
            const id = Date.now().toString(36);
            children.push({ id, name: '小勇士', createdAt: new Date().toISOString() });
            saveChildren(children);
            setCurrentChildId(id);
            saveChildData(id, { records: [], streak: { days: 0, lastDate: null }, tasks: [] });
        } else {
            const currentId = getCurrentChildId();
            if (!currentId || !children.find(c => c.id === currentId)) {
                setCurrentChildId(children[0].id);
            }
        }
        renderChildSelector();
        refreshAll();
    });
</script>
</body>
</html>
