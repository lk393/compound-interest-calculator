<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习成长系统 — 让孩子爱上学习</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="study-style.css" />
    <style>
        /* ===== 今日任务特殊样式 ===== */
        .task-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--gray-100);
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-item .task-check {
            width: 20px;
            height: 20px;
            border: 2px solid var(--gray-300);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            background: white;
        }
        .task-item .task-check.done {
            background: var(--success);
            border-color: var(--success);
            color: white;
            font-size: 12px;
        }
        .task-item .task-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--gray-700);
        }
        .task-item .task-text.done {
            text-decoration: line-through;
            color: var(--gray-400);
        }
        .task-item .task-delete {
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.2rem 0.4rem;
        }
        .task-item .task-delete:hover {
            color: var(--danger);
        }
        .add-task-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .add-task-row input {
            flex: 1;
            padding: 0.5rem 0.7rem;
            border: 1.5px solid var(--gray-300);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .add-task-row input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .add-task-row button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .add-task-row button:hover {
            background: #1d4ed8;
        }

        .task-empty {
            color: var(--gray-400);
            font-size: 0.85rem;
            padding: 0.3rem 0;
        }

        .task-progress {
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== 顶部导航 ===== -->
    <div class="top-nav">
        <a href="../index.html" class="back-link">← 返回首页</a>
        <div class="breadcrumb">📚 <span>学习成长系统</span></div>
    </div>

    <!-- ===== 欢迎区域 ===== -->
    <div class="card" style="background: var(--primary-light); border-left: 4px solid var(--primary);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap;">
            <div>
                <h2 id="greeting">👋 欢迎回来，小勇士！</h2>
                <p id="subGreeting" style="margin:0.2rem 0 0;">今天也要加油哦！每完成一项任务，你离「自律小英雄」就更近一步 🦸</p>
            </div>
            <button onclick="editName()" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:0.85rem;padding:0.2rem 0.5rem;">✏️ 改名</button>
        </div>
    </div>

    <!-- ===== 统计卡片 ===== -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-item highlight">
            <div class="number" id="streakDays">0</div>
            <div class="label">🔥 连续打卡</div>
        </div>
        <div class="stat-item">
            <div class="number" id="totalTasks">0</div>
            <div class="label">📝 完成任务</div>
        </div>
        <div class="stat-item">
            <div class="number" id="avgAccuracy">0%</div>
            <div class="label">🎯 平均正确率</div>
        </div>
        <div class="stat-item">
            <div class="number" id="level">Lv.1</div>
            <div class="label">⭐ 等级</div>
        </div>
    </div>

    <!-- ===== 近期正确率趋势 ===== -->
    <div class="card">
        <h2>📈 最近7天正确率</h2>
        <div class="progress-chart" id="chartContainer">
            <!-- JS 会动态渲染 -->
        </div>
    </div>

    <!-- ===== 今日任务 ===== -->
    <div class="card">
        <h2>📋 今日任务 <span id="taskProgress" class="task-progress"></span></h2>
        <div id="taskListContainer">
            <div id="taskList" class="task-list">
                <!-- JS 动态渲染 -->
            </div>
        </div>
        <div class="add-task-row">
            <input type="text" id="newTaskInput" placeholder="输入新任务，如：数学练习册 P10-15" />
            <button onclick="addTask()">添加</button>
        </div>
        <div class="action-row" style="margin-top:0.8rem;">
            <a href="upload.html" class="btn">📸 拍照上传作业</a>
            <a href="progress.html" class="btn btn-secondary">📊 成长曲线</a>
        </div>
    </div>

    <!-- ===== 最近成就 ===== -->
    <div class="card">
        <h2>🏅 最近获得的徽章</h2>
        <ul class="task-list" id="recentBadges">
            <li style="color:var(--gray-400); padding:0.3rem 0;">继续学习，解锁更多徽章 🏆</li>
        </ul>
    </div>

    <!-- ===== 页脚 ===== -->
    <footer style="text-align:center; color:var(--gray-400); font-size:0.75rem; padding:0.5rem 0; border-top:1px solid var(--gray-200); margin-top:0.5rem;">
        <p>© 2026 — 学习成长系统 · 用坚持看见进步</p>
    </footer>
</div>

<script>
    // ============================================================
    //  数据管理
    // ============================================================

    function getRecords() {
        return JSON.parse(localStorage.getItem('studyRecords') || '[]');
    }

    function getStreak() {
        return JSON.parse(localStorage.getItem('studyStreak') || '{"days":0,"lastDate":null}');
    }

    function getTasks() {
        return JSON.parse(localStorage.getItem('studyTasks') || '[]');
    }

    function saveTasks(tasks) {
        localStorage.setItem('studyTasks', JSON.stringify(tasks));
    }

    // ============================================================
    //  孩子名字管理
    // ============================================================

    function getChildName() {
        return localStorage.getItem('childName') || '小勇士';
    }

    function setChildName(name) {
        localStorage.setItem('childName', name);
        updateGreeting();
    }

    function updateGreeting() {
        const name = getChildName();
        document.getElementById('greeting').textContent = `👋 欢迎回来，${name}！`;
        document.getElementById('subGreeting').textContent = `今天也要加油哦！每完成一项任务，你离「自律小英雄」就更近一步 🦸`;
    }

    function editName() {
        const current = getChildName();
        const newName = prompt('请输入孩子的名字：', current);
        if (newName && newName.trim()) {
            setChildName(newName.trim());
        }
    }

    // ============================================================
    //  今日任务管理
    // ============================================================

    function renderTasks() {
        const tasks = getTasks();
        const list = document.getElementById('taskList');
        const progress = document.getElementById('taskProgress');

        // 按日期过滤今日任务
        const today = new Date().toISOString().slice(0, 10);
        const todayTasks = tasks.filter(t => t.date === today);

        if (todayTasks.length === 0) {
            list.innerHTML = '<li class="task-empty">今天还没有任务，添加一个吧 📝</li>';
            progress.textContent = '';
            return;
        }

        const total = todayTasks.length;
        const done = todayTasks.filter(t => t.done).length;
        progress.textContent = `(${done}/${total} 已完成)`;

        list.innerHTML = todayTasks.map((task, index) => `
            <li class="task-item">
                <div class="task-check ${task.done ? 'done' : ''}" onclick="toggleTask(${index})">
                    ${task.done ? '✓' : ''}
                </div>
                <span class="task-text ${task.done ? 'done' : ''}">${task.text}</span>
                <button class="task-delete" onclick="deleteTask(${index})">✕</button>
            </li>
        `).join('');
    }

    function addTask() {
        const input = document.getElementById('newTaskInput');
        const text = input.value.trim();
        if (!text) {
            alert('请输入任务内容！');
            return;
        }

        const tasks = getTasks();
        const today = new Date().toISOString().slice(0, 10);
        tasks.push({ date: today, text: text, done: false });
        saveTasks(tasks);
        input.value = '';
        renderTasks();
        updateStats();
    }

    function toggleTask(index) {
        const tasks = getTasks();
        const today = new Date().toISOString().slice(0, 10);
        const todayTasks = tasks.filter(t => t.date === today);
        // 找到实际在数组中的位置
        let realIndex = -1;
        let count = 0;
        for (let i = 0; i < tasks.length; i++) {
            if (tasks[i].date === today) {
                if (count === index) { realIndex = i; break; }
                count++;
            }
        }
        if (realIndex !== -1) {
            tasks[realIndex].done = !tasks[realIndex].done;
            saveTasks(tasks);
            renderTasks();
            updateStats();
            // 如果所有任务都完成，增加打卡
            const todayTasksNow = tasks.filter(t => t.date === today);
            if (todayTasksNow.every(t => t.done)) {
                updateStreak(today);
            }
        }
    }

    function deleteTask(index) {
        const tasks = getTasks();
        const today = new Date().toISOString().slice(0, 10);
        let realIndex = -1;
        let count = 0;
        for (let i = 0; i < tasks.length; i++) {
            if (tasks[i].date === today) {
                if (count === index) { realIndex = i; break; }
                count++;
            }
        }
        if (realIndex !== -1) {
            tasks.splice(realIndex, 1);
            saveTasks(tasks);
            renderTasks();
            updateStats();
        }
    }

    // ============================================================
    //  打卡更新
    // ============================================================

    function updateStreak(today) {
        const streak = JSON.parse(localStorage.getItem('studyStreak') || '{"days":0,"lastDate":null}');
        const lastDate = streak.lastDate;

        if (lastDate === today) return;

        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().slice(0, 10);

        if (lastDate === yesterdayStr) {
            streak.days += 1;
        } else {
            streak.days = 1;
        }
        streak.lastDate = today;
        localStorage.setItem('studyStreak', JSON.stringify(streak));
    }

    // ============================================================
    //  统计与渲染
    // ============================================================

    function updateStats() {
        const records = getRecords();
        const streak = getStreak();
        const tasks = getTasks();
        const today = new Date().toISOString().slice(0, 10);
        const todayTasks = tasks.filter(t => t.date === today);

        const days = new Set(records.map(r => r.date));
        const totalDays = days.size;
        const totalTasks = records.length;
        const avg = records.length > 0
            ? Math.round(records.reduce((s, r) => s + r.accuracy, 0) / records.length)
            : 0;
        const bestStreak = streak.days || 0;

        let level = 1;
        if (totalTasks >= 5) level = 2;
        if (totalTasks >= 15) level = 3;
        if (totalTasks >= 30) level = 4;
        if (totalTasks >= 50) level = 5;
        if (totalTasks >= 80) level = 6;

        document.getElementById('streakDays').textContent = bestStreak;
        document.getElementById('totalTasks').textContent = totalTasks;
        document.getElementById('avgAccuracy').textContent = avg + '%';
        document.getElementById('level').textContent = 'Lv.' + level;

        // 渲染趋势图
        renderChart(records);
        // 渲染徽章
        renderBadges(records, streak);
    }

    function renderChart(records) {
        const container = document.getElementById('chartContainer');
        container.innerHTML = '';

        let data = [60, 70, 75, 80, 85, 90, 88];

        if (records.length > 0) {
            const dailyMap = {};
            records.forEach(r => {
                if (!dailyMap[r.date]) dailyMap[r.date] = { total: 0, count: 0 };
                dailyMap[r.date].total += r.accuracy;
                dailyMap[r.date].count += 1;
            });
            const sorted = Object.keys(dailyMap).sort();
            const recent = sorted.slice(-7);
            if (recent.length > 0) {
                data = recent.map(date => Math.round(dailyMap[date].total / dailyMap[date].count));
            }
        }

        const max = Math.max(...data, 10);
        data.forEach(val => {
            const height = (val / max) * 100;
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = height + '%';
            bar.innerHTML = `<span class="bar-label">${val}%</span>`;
            container.appendChild(bar);
        });
    }

    function renderBadges(records, streak) {
        const list = document.getElementById('recentBadges');
        const badges = [];

        if (records.length > 0) badges.push({ icon: '🥇', name: '首战告捷' });
        if (streak.days >= 7) badges.push({ icon: '🔥', name: '七天坚持' });
        if (streak.days >= 14) badges.push({ icon: '⚡', name: '两周先锋' });
        if (streak.days >= 30) badges.push({ icon: '👑', name: '三十天王者' });
        if (records.filter(r => r.accuracy === 100).length > 0) badges.push({ icon: '💯', name: '满分达人' });

        const seen = new Set();
        const unique = badges.filter(b => {
            if (seen.has(b.name)) return false;
            seen.add(b.name);
            return true;
        });

        if (unique.length === 0) {
            list.innerHTML = '<li style="color:var(--gray-400);padding:0.3rem 0;">继续学习，解锁更多徽章 🏆</li>';
            return;
        }

        list.innerHTML = unique.slice(0, 5).map(b =>
            `<li><span class="icon">${b.icon}</span> ${b.name}</li>`
        ).join('');
    }

    // ============================================================
    //  初始化
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
        updateGreeting();
        renderTasks();
        updateStats();
    });
</script>
</body>
</html>
