<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>成长曲线 — 学习成长系统</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="study-style.css" />
    <style>
        /* ===== 标签页切换 ===== */
        .tab-bar {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 0.3rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 0.4rem 1rem;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--gray-400);
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: var(--primary);
            background: var(--primary-light);
        }
        .tab-btn:hover:not(.active) {
            color: var(--gray-600);
            background: var(--gray-50);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ===== 错题复习样式 ===== */
        .error-item {
            background: #fef2f2;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            border-left: 3px solid #ef4444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .error-item .error-info {
            flex: 1;
            min-width: 150px;
        }
        .error-item .error-date {
            font-size: 0.75rem;
            color: var(--gray-400);
        }
        .error-item .error-task {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--gray-700);
        }
        .error-item .error-text {
            font-size: 0.9rem;
            color: var(--gray-600);
            margin-top: 0.2rem;
        }
        .error-item .error-actions {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            flex-shrink: 0;
        }

        .error-item.reviewed {
            background: #f0fdf4;
            border-left-color: #10b981;
            opacity: 0.75;
        }
        .error-item.reviewed .error-text {
            text-decoration: line-through;
            color: var(--gray-400);
        }

        .error-empty {
            color: var(--gray-400);
            text-align: center;
            padding: 1.5rem 0;
        }

        .btn-sm {
            padding: 0.25rem 0.7rem;
            font-size: 0.75rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-review {
            background: var(--primary);
            color: white;
        }
        .btn-review:hover {
            background: #1d4ed8;
        }
        .btn-review.done {
            background: var(--success);
        }
        .btn-review.done:hover {
            background: #059669;
        }
        .btn-delete-error {
            background: #fee2e2;
            color: #991b1b;
        }
        .btn-delete-error:hover {
            background: #fecaca;
        }

        .review-stats {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--gray-600);
        }
        .review-stats span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .review-stats .num-pending {
            color: #ef4444;
            font-weight: 600;
        }
        .review-stats .num-done {
            color: #10b981;
            font-weight: 600;
        }

        .error-sub-tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .error-sub-tab {
            padding: 0.25rem 0.8rem;
            border: 1px solid var(--gray-200);
            border-radius: 20px;
            background: none;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--gray-500);
            transition: all 0.2s;
        }
        .error-sub-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .error-sub-tab:hover:not(.active) {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ===== 学习记录列表 ===== */
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 0;
        }
        .task-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--gray-100);
            font-size: 0.9rem;
            color: var(--gray-700);
        }
        .task-list li .date {
            color: var(--gray-400);
            font-size: 0.8rem;
        }

        /* ===== 徽章墙 ===== */
        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }
        .badge-item {
            background: var(--gray-50);
            border-radius: 20px;
            padding: 0.3rem 0.8rem;
            font-size: 0.85rem;
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }
        .badge-item .icon {
            margin-right: 0.2rem;
        }

        /* ===== 进度条 ===== */
        .progress-chart {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 1rem;
            height: 120px;
            display: flex;
            align-items: flex-end;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }
        .bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }
        .bar-fill {
            width: 100%;
            max-width: 32px;
            border-radius: 4px 4px 0 0;
            background: var(--primary);
            min-height: 4px;
            transition: height 0.4s;
            position: relative;
        }
        .bar-fill .val {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: var(--gray-500);
            font-weight: 500;
            white-space: nowrap;
        }
        .bar-label {
            font-size: 0.6rem;
            color: var(--gray-400);
            margin-top: 4px;
        }

        /* ===== 统计行 ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-bottom: 0.5rem;
        }
        .stat-box {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 0.8rem;
            text-align: center;
        }
        .stat-box .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .stat-box .lbl {
            font-size: 0.75rem;
            color: var(--gray-400);
        }
        .stat-box.highlight .num {
            color: var(--primary);
        }

        @media (max-width: 640px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .tab-btn {
                font-size: 0.75rem;
                padding: 0.3rem 0.6rem;
            }
            .tab-bar {
                gap: 0.2rem;
            }
            .error-item {
                flex-direction: column;
                align-items: stretch;
            }
            .error-item .error-actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== 顶部导航 ===== -->
    <div class="top-nav">
        <a href="index.html" class="back-link">← 返回看板</a>
        <div class="breadcrumb">📊 <span>成长曲线</span></div>
    </div>

    <!-- ===== 当前使用者 ===== -->
    <div style="text-align:right; font-size:0.85rem; color:var(--gray-400); margin-bottom:-0.5rem;">
        👤 <span id="childNameDisplay">小勇士</span>
    </div>

    <!-- ===== 统计概览 ===== -->
    <div class="card">
        <h2>📊 学习数据总览</h2>
        <div class="stats-row" id="statsOverview">
            <div class="stat-box highlight">
                <div class="num" id="totalDays">0</div>
                <div class="lbl">📅 学习天数</div>
            </div>
            <div class="stat-box">
                <div class="num" id="totalTasks">0</div>
                <div class="lbl">📝 完成任务</div>
            </div>
            <div class="stat-box">
                <div class="num" id="avgAccuracy">0%</div>
                <div class="lbl">🎯 平均正确率</div>
            </div>
            <div class="stat-box">
                <div class="num" id="bestStreak">0</div>
                <div class="lbl">🔥 最长连续打卡</div>
            </div>
        </div>
    </div>

    <!-- ===== 标签页切换 ===== -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="trend" onclick="switchTab('trend')">📈 正确率趋势</button>
        <button class="tab-btn" data-tab="records" onclick="switchTab('records')">📋 学习记录</button>
        <button class="tab-btn" data-tab="errors" onclick="switchTab('errors')">📝 错题本</button>
        <button class="tab-btn" data-tab="badges" onclick="switchTab('badges')">🏅 徽章墙</button>
    </div>

    <!-- ===== 内容区：趋势 ===== -->
    <div class="card tab-content active" id="tab-trend">
        <h2>📈 正确率趋势</h2>
        <p>最近7天每天的作业正确率变化</p>
        <div class="progress-chart" id="chartContainer">
            <p style="color:var(--gray-400);text-align:center;width:100%;padding:1rem 0;">加载中...</p>
        </div>
    </div>

    <!-- ===== 内容区：学习记录 ===== -->
    <div class="card tab-content" id="tab-records">
        <h2>📋 全部学习记录</h2>
        <ul class="task-list" id="recordList">
            <li style="color:var(--gray-400);padding:1rem 0;text-align:center;">加载中...</li>
        </ul>
    </div>

    <!-- ===== 内容区：错题本（含复习功能） ===== -->
    <div class="card tab-content" id="tab-errors">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
            <h2 style="margin:0;">📝 错题本</h2>
            <div class="review-stats" id="reviewStats">
                <span>⏳ 待复习: <span class="num-pending" id="pendingCount">0</span></span>
                <span>✅ 已掌握: <span class="num-done" id="doneCount">0</span></span>
            </div>
        </div>
        <p style="font-size:0.9rem;color:var(--gray-500);">每次作业中标记的错题都会汇总在这里，点击"已复习"标记为已掌握</p>

        <!-- 错题子标签 -->
        <div class="error-sub-tabs">
            <button class="error-sub-tab active" data-view="all" onclick="switchErrorView('all')">📋 全部</button>
            <button class="error-sub-tab" data-view="pending" onclick="switchErrorView('pending')">⏳ 待复习</button>
            <button class="error-sub-tab" data-view="done" onclick="switchErrorView('done')">✅ 已掌握</button>
        </div>

        <div id="errorList">
            <div class="error-empty">加载中...</div>
        </div>
    </div>

    <!-- ===== 内容区：徽章墙 ===== -->
    <div class="card tab-content" id="tab-badges">
        <h2>🏅 徽章墙</h2>
        <div class="badge-grid" id="badgeGrid">
            <span style="color:var(--gray-400);font-size:0.9rem;">加载中...</span>
        </div>
    </div>

    <!-- ===== 操作按钮 ===== -->
    <div style="display:flex; gap:0.8rem; flex-wrap:wrap; margin-top:0.5rem;">
        <a href="upload.html" class="btn">📸 继续上传作业</a>
        <a href="index.html" class="btn btn-secondary">📚 返回看板</a>
    </div>

    <!-- ===== 页脚 ===== -->
    <footer style="text-align:center; color:var(--gray-400); font-size:0.75rem; padding:0.5rem 0; border-top:1px solid var(--gray-200); margin-top:1.5rem;">
        <p>© 2026 — 学习成长系统 · 用坚持看见进步</p>
    </footer>
</div>

<script>
    // ============================================================
    //  数据读取
    // ============================================================

    function getRecords() {
        return JSON.parse(localStorage.getItem('studyRecords') || '[]');
    }

    function saveRecords(records) {
        localStorage.setItem('studyRecords', JSON.stringify(records));
    }

    function getStreak() {
        return JSON.parse(localStorage.getItem('studyStreak') || '{"days":0,"lastDate":null}');
    }

    function getChildName() {
        return localStorage.getItem('childName') || '小勇士';
    }

    // ============================================================
    //  标签页切换
    // ============================================================

    let currentErrorView = 'all';

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        const target = document.getElementById('tab-' + tabId);
        if (target) target.classList.add('active');
        const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
        if (btn) btn.classList.add('active');
        if (tabId === 'errors') {
            renderErrors();
        }
    }

    function switchErrorView(view) {
        currentErrorView = view;
        document.querySelectorAll('.error-sub-tab').forEach(el => el.classList.remove('active'));
        const btn = document.querySelector(`.error-sub-tab[data-view="${view}"]`);
        if (btn) btn.classList.add('active');
        renderErrors();
    }

    // ============================================================
    //  统计概览
    // ============================================================

    function renderStats() {
        const records = getRecords();
        const streak = getStreak();

        const days = new Set(records.map(r => r.date));
        const totalDays = days.size;
        const totalTasks = records.length;
        const avg = records.length > 0
            ? Math.round(records.reduce((s, r) => s + r.accuracy, 0) / records.length)
            : 0;
        const bestStreak = streak.days || 0;

        document.getElementById('totalDays').textContent = totalDays;
        document.getElementById('totalTasks').textContent = totalTasks;
        document.getElementById('avgAccuracy').textContent = avg + '%';
        document.getElementById('bestStreak').textContent = bestStreak;
    }

    // ============================================================
    //  趋势图
    // ============================================================

    function renderChart() {
        const records = getRecords();
        const container = document.getElementById('chartContainer');
        container.innerHTML = '';

        if (records.length === 0) {
            container.innerHTML = '<p style="color:var(--gray-400);text-align:center;width:100%;padding:1rem 0;">还没有学习记录，快去上传吧 🚀</p>';
            return;
        }

        const dailyMap = {};
        records.forEach(r => {
            if (!dailyMap[r.date]) dailyMap[r.date] = { total: 0, count: 0 };
            dailyMap[r.date].total += r.accuracy;
            dailyMap[r.date].count += 1;
        });

        const sorted = Object.keys(dailyMap).sort();
        const recent = sorted.slice(-7);
        const maxVal = 100;

        if (recent.length === 0) {
            container.innerHTML = '<p style="color:var(--gray-400);text-align:center;width:100%;padding:1rem 0;">暂无数据</p>';
            return;
        }

        recent.forEach(date => {
            const avg = Math.round(dailyMap[date].total / dailyMap[date].count);
            const height = Math.max((avg / maxVal) * 100, 4);

            const wrap = document.createElement('div');
            wrap.className = 'bar-wrap';

            const fill = document.createElement('div');
            fill.className = 'bar-fill';
            fill.style.height = height + '%';
            fill.innerHTML = `<span class="val">${avg}%</span>`;

            const label = document.createElement('div');
            label.className = 'bar-label';
            const parts = date.split('-');
            label.textContent = parts[1] + '/' + parts[2];

            wrap.appendChild(fill);
            wrap.appendChild(label);
            container.appendChild(wrap);
        });
    }

    // ============================================================
    //  学习记录列表
    // ============================================================

    function renderRecords() {
        const records = getRecords();
        const list = document.getElementById('recordList');
        list.innerHTML = '';

        if (records.length === 0) {
            list.innerHTML = '<li style="color:var(--gray-400);padding:1rem 0;text-align:center;">还没有学习记录，开始上传吧 📸</li>';
            return;
        }

        const sorted = [...records].reverse();
        sorted.forEach(r => {
            const li = document.createElement('li');
            const date = r.date || '未知日期';
            const color = r.accuracy >= 80 ? 'var(--success)' : r.accuracy >= 60 ? 'var(--warning)' : 'var(--danger)';
            li.innerHTML = `
                <span>${r.taskName || '未命名'}</span>
                <span>
                    <span class="date">${date}</span>
                    <span style="font-weight:600;color:${color};">${r.accuracy}% (${r.correct}/${r.total})</span>
                </span>
            `;
            list.appendChild(li);
        });
    }

    // ============================================================
    //  错题本（含复习功能）
    // ============================================================

    function getErrors() {
        const records = getRecords();
        const result = [];
        records.forEach(r => {
            if (r.errors && r.errors.length > 0) {
                r.errors.forEach(err => {
                    // 兼容旧数据：如果 err 是字符串，转为对象
                    if (typeof err === 'string') {
                        result.push({
                            date: r.date,
                            taskName: r.taskName || '未命名作业',
                            text: err,
                            reviewed: false,
                            recordIndex: records.indexOf(r),
                            errorIndex: r.errors.indexOf(err)
                        });
                    } else {
                        result.push({
                            date: r.date,
                            taskName: r.taskName || '未命名作业',
                            text: err.text || '待复习',
                            reviewed: err.reviewed || false,
                            recordIndex: records.indexOf(r),
                            errorIndex: r.errors.indexOf(err)
                        });
                    }
                });
            }
        });
        return result;
    }

    function toggleReview(errorKey) {
        const records = getRecords();
        let found = false;
        records.forEach(r => {
            if (r.errors && r.errors.length > 0) {
                r.errors.forEach((err, idx) => {
                    // 匹配：通过日期 + 任务名 + 错题文本
                    if (r.date === errorKey.date &&
                        r.taskName === errorKey.taskName &&
                        (typeof err === 'string' ? err === errorKey.text : err.text === errorKey.text)) {
                        if (typeof err === 'string') {
                            // 旧格式字符串，转为对象
                            r.errors[idx] = { text: err, reviewed: true };
                        } else {
                            r.errors[idx].reviewed = !err.reviewed;
                        }
                        found = true;
                    }
                });
            }
        });
        if (found) {
            saveRecords(records);
            renderErrors();
            updateReviewStats();
        }
    }

    function deleteError(errorKey) {
        if (!confirm('确定要删除这条错题吗？')) return;
        const records = getRecords();
        records.forEach(r => {
            if (r.errors && r.errors.length > 0) {
                r.errors = r.errors.filter((err, idx) => {
                    if (r.date === errorKey.date &&
                        r.taskName === errorKey.taskName) {
                        if (typeof err === 'string') {
                            return err !== errorKey.text;
                        } else {
                            return err.text !== errorKey.text;
                        }
                    }
                    return true;
                });
            }
        });
        saveRecords(records);
        renderErrors();
        updateReviewStats();
    }

    function updateReviewStats() {
        const errors = getErrors();
        const pending = errors.filter(e => !e.reviewed).length;
        const done = errors.filter(e => e.reviewed).length;
        document.getElementById('pendingCount').textContent = pending;
        document.getElementById('doneCount').textContent = done;
    }

    function renderErrors() {
        let errors = getErrors();
        const container = document.getElementById('errorList');

        // 根据视图过滤
        if (currentErrorView === 'pending') {
            errors = errors.filter(e => !e.reviewed);
        } else if (currentErrorView === 'done') {
            errors = errors.filter(e => e.reviewed);
        }

        // 按时间倒序
        errors.sort((a, b) => b.date.localeCompare(a.date));

        if (errors.length === 0) {
            const msg = currentErrorView === 'pending' ? '🎉 所有错题都已掌握！继续保持！' :
                        currentErrorView === 'done' ? '📝 还没有已掌握的错题，开始复习吧！' :
                        '🎉 还没有错题，继续保持！';
            container.innerHTML = `<div class="error-empty">${msg}</div>`;
            return;
        }

        container.innerHTML = errors.map(e => {
            const reviewed = e.reviewed;
            const statusText = reviewed ? '✅ 已掌握' : '⏳ 待复习';
            const btnText = reviewed ? '🔄 重新复习' : '✅ 已复习';
            const btnClass = reviewed ? 'btn-review done' : 'btn-review';

            return `
                <div class="error-item ${reviewed ? 'reviewed' : ''}">
                    <div class="error-info">
                        <div class="error-date">${e.date} · ${e.taskName}</div>
                        <div class="error-text">📌 ${e.text}</div>
                        <div style="font-size:0.75rem;color:var(--gray-400);margin-top:0.2rem;">${statusText}</div>
                    </div>
                    <div class="error-actions">
                        <button class="btn-sm ${btnClass}" onclick="toggleReview({date:'${e.date}', taskName:'${e.taskName}', text:'${e.text.replace(/'/g, "\\'")}'})">
                            ${btnText}
                        </button>
                        <button class="btn-sm btn-delete-error" onclick="deleteError({date:'${e.date}', taskName:'${e.taskName}', text:'${e.text.replace(/'/g, "\\'")}'})">
                            🗑️
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    //  徽章墙
    // ============================================================

    function renderBadges() {
        const records = getRecords();
        const grid = document.getElementById('badgeGrid');
        const badges = [];

        if (records.length > 0) badges.push({ icon: '🥇', name: '首战告捷' });
        const streak = getStreak();
        if (streak.days >= 7) badges.push({ icon: '🔥', name: '七天坚持' });
        if (streak.days >= 14) badges.push({ icon: '⚡', name: '两周先锋' });
        if (streak.days >= 30) badges.push({ icon: '👑', name: '三十天王者' });
        if (records.filter(r => r.accuracy === 100).length > 0) badges.push({ icon: '💯', name: '满分达人' });
        if (records.filter(r => r.errors && r.errors.length > 0).length > 0) badges.push({ icon: '📝', name: '错题猎人' });
        // 复习徽章：有错题且全部已复习
        const allErrors = getErrors();
        if (allErrors.length > 0 && allErrors.every(e => e.reviewed)) {
            badges.push({ icon: '🧠', name: '复习大师' });
        }

        const days = new Set(records.map(r => r.date));
        if (days.size >= 3) badges.push({ icon: '🌱', name: '习惯萌芽' });
        if (days.size >= 10) badges.push({ icon: '🌿', name: '稳步前行' });
        if (days.size >= 20) badges.push({ icon: '🌳', name: '自律小达人' });

        const seen = new Set();
        const unique = badges.filter(b => {
            if (seen.has(b.name)) return false;
            seen.add(b.name);
            return true;
        });

        if (unique.length === 0) {
            grid.innerHTML = '<span style="color:var(--gray-400);font-size:0.9rem;">继续学习，解锁更多徽章 🏆</span>';
            return;
        }

        grid.innerHTML = unique.map(b =>
            `<span class="badge-item"><span class="icon">${b.icon}</span> ${b.name}</span>`
        ).join('');
    }

    // ============================================================
    //  初始化
    // ============================================================

    function init() {
        document.getElementById('childNameDisplay').textContent = getChildName();
        renderStats();
        renderChart();
        renderRecords();
        renderErrors();
        updateReviewStats();
        renderBadges();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
