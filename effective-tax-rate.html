<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>有效税率计算器 - Smart Finance Tools</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container" style="max-width:700px; margin:40px auto; padding:20px;">
    <h1>🧾 有效税率计算器</h1>
    <p>根据总收入和实际纳税额计算您的真实税负率。</p>
    <div class="card" style="padding:25px; background:#f9fafc; border-radius:16px;">
        <div class="input-group" style="margin-bottom:15px;">
            <label>年总收入 (¥)</label>
            <input type="number" id="income" value="80000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div class="input-group" style="margin-bottom:20px;">
            <label>年度总纳税额 (¥)</label>
            <input type="number" id="tax" value="12000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <button onclick="calcEffectiveTax()" class="btn" style="background:#2563eb; color:#fff; padding:12px 24px; border:none; border-radius:8px; cursor:pointer; font-size:16px;">计算</button>
        <div id="result" style="margin-top:20px; font-size:16px; background:#eef2ff; padding:15px; border-radius:8px;"></div>
    </div>
</div>
<script>
    function calcEffectiveTax() {
        const income = parseFloat(document.getElementById('income').value);
        const tax = parseFloat(document.getElementById('tax').value);
        if (isNaN(income) || isNaN(tax)) return alert('请输入有效数字');
        const rate = (tax / income) * 100;
        document.getElementById('result').innerHTML = `
            <strong>有效税率</strong>：${rate.toFixed(2)}%<br>
            <strong>净收入</strong>：¥${(income - tax).toFixed(2)}
        `;
    }
</script>
<script src="feedback.js"></script>
<script src="recommendations.js"></script>
</body>
</html>
