<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>租金收益率计算器 - Smart Finance Tools</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container" style="max-width:700px; margin:40px auto; padding:20px;">
    <h1>📊 租金收益率计算器</h1>
    <p>计算房产的毛租金收益率和净租金收益率。</p>
    <div class="card" style="padding:25px; background:#f9fafc; border-radius:16px;">
        <div class="input-group" style="margin-bottom:15px;">
            <label>年租金收入 (¥)</label>
            <input type="number" id="annualRent" value="60000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div class="input-group" style="margin-bottom:15px;">
            <label>房产当前价值 (¥)</label>
            <input type="number" id="propertyValue" value="1000000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div class="input-group" style="margin-bottom:20px;">
            <label>年持有成本 (物业费、税等) (¥)</label>
            <input type="number" id="costs" value="8000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <button onclick="calcYield()" class="btn" style="background:#2563eb; color:#fff; padding:12px 24px; border:none; border-radius:8px; cursor:pointer; font-size:16px;">计算</button>
        <div id="result" style="margin-top:20px; font-size:16px; background:#eef2ff; padding:15px; border-radius:8px;"></div>
    </div>
</div>
<script>
    function calcYield() {
        const rent = parseFloat(document.getElementById('annualRent').value);
        const value = parseFloat(document.getElementById('propertyValue').value);
        const costs = parseFloat(document.getElementById('costs').value);
        if (isNaN(rent) || isNaN(value) || isNaN(costs)) return alert('请输入有效数字');
        const gross = (rent / value) * 100;
        const net = ((rent - costs) / value) * 100;
        document.getElementById('result').innerHTML = `
            <strong>毛租金收益率</strong>：${gross.toFixed(2)}%<br>
            <strong>净租金收益率</strong>：${net.toFixed(2)}%
        `;
    }
</script>
<script src="feedback.js"></script>
<script src="recommendations.js"></script>
</body>
</html>
