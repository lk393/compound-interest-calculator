<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人贷款计算器 - Smart Finance Tools</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container" style="max-width:700px; margin:40px auto; padding:20px;">
    <h1>🏦 个人贷款计算器</h1>
    <p>计算等额本息贷款的月供、总利息和总还款额。</p>
    <div class="card" style="padding:25px; background:#f9fafc; border-radius:16px;">
        <div class="input-group" style="margin-bottom:15px;">
            <label>贷款金额 (¥)</label>
            <input type="number" id="loanAmount" value="100000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div class="input-group" style="margin-bottom:15px;">
            <label>年利率 (%)</label>
            <input type="number" id="rate" value="6.5" step="0.1" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div class="input-group" style="margin-bottom:20px;">
            <label>贷款期限 (月)</label>
            <input type="number" id="months" value="36" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <button onclick="calcPersonalLoan()" class="btn" style="background:#2563eb; color:#fff; padding:12px 24px; border:none; border-radius:8px; cursor:pointer; font-size:16px;">计算</button>
        <div id="result" style="margin-top:20px; font-size:16px; background:#eef2ff; padding:15px; border-radius:8px;"></div>
    </div>
</div>
<script>
    function calcPersonalLoan() {
        const P = parseFloat(document.getElementById('loanAmount').value);
        const r = parseFloat(document.getElementById('rate').value) / 100 / 12;
        const n = parseInt(document.getElementById('months').value);
        if (isNaN(P) || isNaN(r) || isNaN(n)) return alert('请输入有效数字');
        const payment = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
        const total = payment * n;
        const interest = total - P;
        document.getElementById('result').innerHTML = `
            <strong>每月还款</strong>：¥${payment.toFixed(2)}<br>
            <strong>总还款额</strong>：¥${total.toFixed(2)}<br>
            <strong>总利息</strong>：¥${interest.toFixed(2)}
        `;
    }
</script>
<script src="feedback.js"></script>
<script src="recommendations.js"></script>
</body>
</html>
