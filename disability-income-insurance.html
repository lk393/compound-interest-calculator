        {
          "@type": "Question",
          "name": "How much disability income insurance do I need?",
          "acceptedAnswer": { "@type": "Answer", "text": "Aim to replace 60-80% of your pre-tax income. If you earn $60,000/year, you need $3,000-$4,000/month in coverage. Higher earners may need more." }
        },
        {
          "@type": "Question",
          "name": "What is the typical waiting period for disability insurance?",
          "acceptedAnswer": { "@type": "Answer", "text": "Common waiting periods are 30, 60, 90, or 180 days. A 90-day waiting period is a good balance — premiums are reasonable and you have enough savings to cover the gap." }
        },
        {
          "@type": "Question",
          "name": "Do I need disability insurance if I have workers' comp?",
          "acceptedAnswer": { "@type": "Answer", "text": "Workers' comp only covers work-related injuries (less than 5% of all disabilities). Disability insurance covers all illnesses and injuries, including non-work-related conditions like cancer or back issues." }
        }
      ]
    }
    </script>
